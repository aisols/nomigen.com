<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Oitu by Nomigen — Hard to say? Say it here first.</title>
  <desc id="description">Voice rehearsal for your next difficult conversation. An example response: I'm not available this weekend.</desc>
  <defs>
    <style>
      @font-face{font-family:Inter;src:url('/fonts/inter-latin-variable.woff2');font-weight:100 900}
      @font-face{font-family:Barlow;src:url('/fonts/barlow-condensed-semibold.ttf');font-weight:600}
      text{font-family:Inter,Arial,sans-serif}
      .display{font-family:Barlow,'Arial Narrow',sans-serif;font-weight:600;letter-spacing:-1.5px}
    </style>
  </defs>
  <rect width="1200" height="630" fill="#142127"/>
  <text x="70" y="80" fill="#f3f7f5" font-size="45" font-weight="650" letter-spacing="-1.5">oitu</text>
  <text x="165" y="77" fill="#b5c5cb" font-size="16">by Nomigen</text>
  <text x="995" y="77" fill="#83e3e7" font-size="15">Private Alpha</text>
  <text class="display" x="70" y="218" fill="#f3f7f5" font-size="96">Hard to say?</text>
  <text class="display" x="316" y="323" fill="#f3f7f5" font-size="96">Say it here first.</text>
  <text x="74" y="391" fill="#b5c5cb" font-size="22">Voice rehearsal for your next difficult conversation.</text>
  <rect y="456" width="1200" height="174" fill="#83e3e7"/>
  <text x="73" y="498" fill="#153137" font-size="14">You, with a little practice</text>
  <text class="display" x="70" y="565" fill="#153137" font-size="56">“I'm not available this weekend.”</text>
  <text x="990" y="598" fill="#153137" font-size="17">nomigen.com</text>
</svg>
